apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-root-ca
  secretName: homelab-root-ca-secret
  duration: 87600h # 10년 유효
  renewBefore: 720h # 만료 30일 전 자동 갱신
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-issuer
spec:
  ca:
    secretName: homelab-root-ca-secret
