apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: infra
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Applications'
        orgId: 1
        folder: 'Applications'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/definitions
