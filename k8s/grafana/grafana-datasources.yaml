apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infra
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.infra.svc.cluster.local:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s

      - name: Loki
        type: loki
        access: proxy
        url: http://loki-service.infra.svc.cluster.local:3100
        editable: true
        jsonData:
          maxLines: 1000
