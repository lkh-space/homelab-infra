apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeview
  namespace: infra
  labels:
    app.kubernetes.io/name: kubeview
    app.kubernetes.io/part-of: homelab-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeview-viewer
  labels:
    app.kubernetes.io/name: kubeview
    app.kubernetes.io/part-of: homelab-infra
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
      - endpoints
      - namespaces
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeview-viewer-binding
  labels:
    app.kubernetes.io/name: kubeview
    app.kubernetes.io/part-of: homelab-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeview-viewer
subjects:
  - kind: ServiceAccount
    name: kubeview
    namespace: infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeview
  namespace: infra
  labels:
    app.kubernetes.io/name: kubeview
    app.kubernetes.io/part-of: homelab-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeview
        app.kubernetes.io/part-of: homelab-infra
    spec:
      serviceAccountName: kubeview
      containers:
        - name: kubeview
          image: ghcr.io/benc-uk/kubeview:2.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeview-service
  namespace: infra
  labels:
    app.kubernetes.io/name: kubeview
    app.kubernetes.io/part-of: homelab-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubeview
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
