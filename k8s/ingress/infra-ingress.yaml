apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: opensearch-transport
  namespace: infra
spec:
  insecureSkipVerify: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-ingress
  namespace: infra
  labels:
    app.kubernetes.io/part-of: homelab-infra
spec:
  ingressClassName: traefik
  rules:
    - host: minio.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9001
    - host: s3.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9000
    - host: rabbitmq.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq-service
                port:
                  number: 15672
    - host: dashboards.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensearch-dashboards-service
                port:
                  number: 5601
    - host: opensearch.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensearch-service
                port:
                  number: 9200
