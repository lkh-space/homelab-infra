apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-space-backend
  namespace: apps
  labels:
    app: my-space-backend
    app.kubernetes.io/name: my-space-backend
    app.kubernetes.io/part-of: homelab-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-space-backend
  template:
    metadata:
      labels:
        app: my-space-backend
    spec:
      containers:
        - name: backend
          image: limkeunhyeok/my-space-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /docs
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: my-space-backend
  namespace: apps
  labels:
    app: my-space-backend
    app.kubernetes.io/name: my-space-backend
    app.kubernetes.io/part-of: homelab-apps
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: my-space-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-space-backend-ingress
  namespace: apps
  labels:
    app: my-space-backend
    app.kubernetes.io/name: my-space-backend
    app.kubernetes.io/part-of: homelab-apps
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.homelab.local
      secretName: backend-tls
  rules:
    - host: api.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-space-backend
                port:
                  number: 3000
