apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-space-backend
  namespace: apps
  labels:
    app: my-space-backend
    app.kubernetes.io/name: my-space-backend
    app.kubernetes.io/part-of: homelab-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-space-backend
  template:
    metadata:
      labels:
        app: my-space-backend
    spec:
      containers:
        - name: backend
          image: limkeunhyeok/my-space-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /docs
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
