apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-space-frontend
  namespace: apps
  labels:
    app: my-space-frontend
    app.kubernetes.io/name: my-space-frontend
    app.kubernetes.io/part-of: homelab-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-space-frontend
  template:
    metadata:
      labels:
        app: my-space-frontend
    spec:
      containers:
        - name: frontend
          image: limkeunhyeok/my-space-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: "https://api.homelab.local"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: my-space-frontend
  namespace: apps
  labels:
    app: my-space-frontend
    app.kubernetes.io/name: my-space-frontend
    app.kubernetes.io/part-of: homelab-apps
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: my-space-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-space-frontend-ingress
  namespace: apps
  labels:
    app: my-space-frontend
    app.kubernetes.io/name: my-space-frontend
    app.kubernetes.io/part-of: homelab-apps
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - my-space.homelab.local
      secretName: frontend-tls
  rules:
    - host: my-space.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-space-frontend
                port:
                  number: 80
