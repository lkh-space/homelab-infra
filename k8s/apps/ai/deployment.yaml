apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-space-ai
  namespace: apps
  labels:
    app: my-space-ai
    app.kubernetes.io/name: my-space-ai
    app.kubernetes.io/part-of: homelab-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-space-ai
  template:
    metadata:
      labels:
        app: my-space-ai
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: ai
          image: chungdaeking/my-space-ai:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: ai-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
